[package]
name = "worker_on_headless_browser"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
chrome-driver-rs = "0.1.3"
clap = { version = "4.5.53", features = ["derive", "env"] }
crc32fast = "1.5.0"
serde = "1.0.228"
serde_json = "1.0.145"
thirtyfour = "0.36.1"
tokio = { version = "1.48.0", features = ["full"] }
tracing = "0.1.43"
tracing-subscriber = { version = "0.3.22", features = ["fmt", "env-filter"] }
